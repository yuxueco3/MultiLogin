name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Patch Gradle Repositories
        run: |
          sed -i '/https:\/\/maven.aliyun.com\/repository\/public/d' repositories
          grep -q '^https:\/\/repo1.maven.org\/maven2$' repositories || echo 'https://repo1.maven.org/maven2' >> repositories

      - name: Prepare Velocity 4.3.1 proxy
        run: ./gradlew --no-daemon getLatestVelocity

      - name: Build and test
        run: ./gradlew --no-daemon test shadowJar

      - name: Upload JAR artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: MultiLogin-build-artifacts
          path: |
            **/build/libs/*.jar
