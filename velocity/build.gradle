plugins {
    id 'com.gradleup.shadow' version '9.1.0'
}

repositories {
    mavenLocal()
    maven {
        name 'papermc'
        url 'https://repo.papermc.io/repository/maven-public/'
    }
    mavenCentral()
    maven { url = 'https://maven.elytrium.net/repo/' }
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

dependencies {
    implementation project(":api")
    implementation project(":flows")
    implementation project(":loader")

    compileOnly 'io.netty:netty-all:4.1.86.Final'
    compileOnly 'net.minecrell:terminalconsoleappender:1.3.0'
    compileOnly 'com.velocitypowered:velocity-api:4.3.1'
    // velocity-proxy is not published to PaperMC Maven; it is built from the v4.3.1 tag.
    compileOnly files("${rootDir}/velocity/libraries/velocity-proxy-4.3.1.jar")
}


shadowJar {
    archiveBaseName.set('MultiLogin-Velocity')

    if (System.getProperty("env", "AUTO") == "final") {
        archiveVersion.set(project.plugin_version as String)
    } else {
        String ver = "Build_" + version
        archiveVersion.set(ver)
    }
    archiveClassifier.set("")
    from {
        project(':core').tasks.shadowJar.archiveFile
    }
    from {
        project(':velocity:injector').tasks.shadowJar.archiveFile
    }
}

def buildRoot = "${projectDir}/libraries/Velocity"
def velocityRef = "v4.3.1"

tasks.register('cloneVelocity') {
    doLast {
        def tagRef = "refs/tags/${velocityRef}"
        if (file("${buildRoot}/.git").exists()) {
            def tagExists = project.providers.exec {
                workingDir = file(buildRoot)
                commandLine "git", "rev-parse", "-q", "--verify", tagRef
            }.result.get().exitValue == 0
            if (tagExists) {
                println "Velocity ${velocityRef} already available locally, checking out."
            } else {
                println "Fetching Velocity ${velocityRef} (shallow)..."
                project.providers.exec {
                    workingDir = file(buildRoot)
                    commandLine "git", "fetch", "--depth", "1", "origin", tagRef
                }.result.get().assertNormalExitValue()
            }
            def checkoutRef = tagExists ? tagRef : "FETCH_HEAD"
            project.providers.exec {
                workingDir = file(buildRoot)
                commandLine "git", "checkout", "--force", "--detach", checkoutRef
            }.result.get().assertNormalExitValue()
        } else {
            println "Cloning Velocity ${velocityRef} (shallow)..."
            project.providers.exec {
                commandLine "git", "clone", "--depth", "1", "--single-branch", "--branch", velocityRef,
                        "https://github.com/PaperMC/Velocity", buildRoot
            }.result.get().assertNormalExitValue()
        }
    }
}

tasks.register('buildVelocity', Exec) {
    dependsOn 'cloneVelocity'
    doFirst {
        def currentJavaVersion = JavaVersion.current()
        if (currentJavaVersion.isJava8()) {
            throw new GradleException("This build requires at least Java 11. You are using Java ${currentJavaVersion}. Please update your Java version.")
        }
        environment "JAVA_HOME", System.getProperty("java.home")
        workingDir = file("${buildRoot}")
    }
    def gradlewCmd = System.getProperty('os.name').toLowerCase().contains('win') ? "gradlew.bat" : "./gradlew"
    commandLine "${buildRoot}/${gradlewCmd}", ":velocity-proxy:jar", "--no-daemon", "--parallel", "-x", "test"
    doLast {
        println "Velocity proxy jar has been built."
    }
}

tasks.register('getLatestVelocity', Copy) {
    dependsOn 'buildVelocity'
    from("${buildRoot}/proxy/build/libs") {
        include "velocity-proxy-4.3.1.jar"
    }
    into "${projectDir}/libraries"
}

artifacts {
    archives shadowJar
}
