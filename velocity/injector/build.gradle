plugins {
    id 'com.gradleup.shadow'
}

repositories {
    mavenLocal()
    maven {
        name 'papermc'
        url 'https://repo.papermc.io/repository/maven-public/'
    }
    mavenCentral()
    maven { url = 'https://maven.elytrium.net/repo/' }
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

dependencies {
    compileOnly project(":api")
    compileOnly project(":core")
    compileOnly project(":velocity")

    compileOnly 'io.netty:netty-all:4.1.86.Final'
    compileOnly 'net.minecrell:terminalconsoleappender:1.3.0'
    compileOnly 'com.velocitypowered:velocity-api:4.3.1'
    annotationProcessor 'com.velocitypowered:velocity-api:4.3.1'
    compileOnly files("${rootDir}/velocity/libraries/velocity-proxy-4.3.1.jar")
}

shadowJar {
    archiveFileName = 'MultiLogin-Velocity-Injector.JarFile'
}

artifacts {
    archives shadowJar
}
